<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f1">
    <title>My Profile — Haven Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="pages.js"></script>
  </head>
  <body data-page="profile">
    <div class="announcement">Your account, all in one place</div>
    <header class="page-header"><a class="brand" href="index.html"><span class="brand-mark">h</span><span>haven<span class="brand-light">market</span></span></a><nav><a href="index.html#collection">Shop</a><a href="cart.html">Bag</a><a class="active" href="profile.html">Profile</a><a href="orders.html">Orders</a><a href="admin.html">Admin</a></nav></header>
    <main class="page-main narrow-page">
      <p class="eyebrow">YOUR ACCOUNT</p><h1 class="page-title">Edit your profile.</h1><p class="page-intro">Update the details saved to your store account.</p>
      <form class="page-panel page-form" id="profile-form">
        <label>Full name<input name="name" type="text" autocomplete="name" minlength="2" required></label>
        <label>Email address<input name="email" type="email" autocomplete="email" readonly aria-describedby="email-note"></label>
        <small id="email-note" class="field-note">Email changes are not supported by this backend.</small>
        <label>Phone number<input name="phone" type="tel" autocomplete="tel"></label>
        <label>Delivery address<textarea name="address" rows="3" autocomplete="street-address"></textarea></label>
        <label>New password <span class="field-note">(leave blank to keep your current password)</span><input name="password" type="password" autocomplete="new-password" minlength="6"></label>
        <p id="page-message" class="form-message" aria-live="polite"></p>
        <button class="primary-button full-button" id="profile-submit" type="submit">Save profile</button>
      </form>
      <div class="page-links"><a href="orders.html">View my orders →</a><a href="admin.html">Admin dashboard →</a></div>
    </main>
    <footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">h</span><span>haven<span class="brand-light">market</span></span></a><p>Little things, lovely living.</p><a href="index.html">Back to shop</a></footer>
  </body>
</html>
